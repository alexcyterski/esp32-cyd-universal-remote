[platformio]
default_envs = e32r28t_simple

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.embed_files = assets/catalog.bin
; Pinned library sources are bundled in lib/; see THIRD_PARTY.md.
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=40000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D DISABLE_ALL_LIBRARY_WARNINGS=1
  -std=gnu++17
build_unflags = -std=gnu++11

[env:e32r28t_simple]
build_flags =
  ${env.build_flags}
  -D PULSE_FULL_BUILD=0
  -D PULSE_IR_DUTY=50

[env:e32r28t_full]
build_flags =
  ${env.build_flags}
  -D PULSE_FULL_BUILD=1
  -D PULSE_IR_DUTY=33
