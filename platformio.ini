[platformio]
default_envs = e32r28t_simple

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_build.partitions = partitions.csv
board_build.embed_files = assets/catalog.bin
board_upload.offset_address = 0x20000
; The custom layout has 64 KB NVS through 0x18FFF and no OTA data partition.
; Override PlatformIO's generic ESP32 recipe, which otherwise writes boot_app0
; into NVS at 0xE000 and places the application at the default 0x10000.
upload_command = "$PYTHONEXE" "$UPLOADER" --chip esp32 --port "$UPLOAD_PORT" --baud $UPLOAD_SPEED --before default_reset --after hard_reset write_flash -z --flash_mode dio --flash_freq 40m --flash_size 4MB 0x1000 "$BUILD_DIR/bootloader.bin" 0x8000 "$BUILD_DIR/partitions.bin" 0x20000 "$SOURCE"
; Pinned library sources are bundled in lib/; see THIRD_PARTY.md.
build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=40000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D DISABLE_ALL_LIBRARY_WARNINGS=1
  -std=gnu++17
build_unflags = -std=gnu++11

[env:e32r28t_simple]
build_flags =
  ${env.build_flags}
  -D PULSE_FULL_BUILD=0
  -D PULSE_IR_DUTY=50

[env:e32r28t_full]
build_flags =
  ${env.build_flags}
  -D PULSE_FULL_BUILD=1
  -D PULSE_IR_DUTY=33
